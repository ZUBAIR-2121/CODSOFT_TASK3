<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CodSoft Level 1 Task 3 calculator." />
  <title>Calculator | CodSoft</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <div class="top-row">
        <div>
          <strong>CALCULATOR</strong>
          <span>CodSoft Level 1 · Task 3</span>
        </div>
        <div class="status-dot" title="Ready"></div>
      </div>

      <div class="screen">
        <div id="history" class="history"></div>
        <input id="display" type="text" value="0" readonly aria-label="Calculator display" />
      </div>

      <div class="keys">
        <button class="key function" data-action="clear">AC</button>
        <button class="key function" data-action="delete">DEL</button>
        <button class="key function" data-value="%">%</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="calculate">=</button>
      </div>

      <p class="hint">Keyboard: numbers, + − × ÷ %, Enter, Backspace and Esc</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
